<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FleetOps Management Hub</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

    <header>
        <div class="logo-container">
            <h1>⚡ Fleet<span>Ops</span></h1>
        </div>
        <nav>
            <a href="/index.html">Dashboard</a>
            <a href="./dashboard.html" class="active">Management Hub</a>
        </nav>
    </header>

    <main class="management-container">
        <h2>Operational Management Hub</h2>
        <p class="hub-subtitle">Log active mileage updates, administrative resource outlays, and register new assets.
        </p>

        <div class="management-grid">
            <!-- Form 1: Mileage Logging Matrix -->
            <section class="form-card">
                <h3>Update Vehicle Mileage</h3>
                <form id="mileageForm">
                    <div class="form-group">
                        <label for="mileageVehicleSelect">Select Target Vehicle Asset</label>
                        <select id="mileageVehicleSelect" required>
                            <option value="" disabled selected>Loading assets...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="newOdometer">New Odometer Reading (km)</label>
                        <input type="number" id="newOdometer" min="1" placeholder="e.g. 126000" required>
                    </div>
                    <button type="submit" class="action-btn amber-btn">Log Mileage Update</button>
                </form>
                <div id="mileageFeedback" class="form-feedback"></div>
            </section>

            <!-- Form 2: Operating Expense Ledger Logger -->
            <section class="form-card">
                <h3>Log Operational Expense</h3>
                <form id="expenseForm">
                    <div class="form-group">
                        <label for="expenseVehicleSelect">Select Target Vehicle Asset</label>
                        <select id="expenseVehicleSelect" required>
                            <option value="" disabled selected>Loading assets...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="expenseDesc">Expense Description</label>
                        <input type="text" id="expenseDesc" placeholder="e.g. Premium Tyres Replacement" required>
                    </div>
                    <!-- INTERACTIVE DATE PICKER CONTROL -->
                    <div class="form-group">
                        <label for="expenseDate">Service / Maintenance Date</label>
                        <input type="date" id="expenseDate" required>
                    </div>
                    <div class="form-group">
                        <label for="expenseCost">Total Financial Cost ($ USD)</label>
                        <input type="number" id="expenseCost" min="1" placeholder="e.g. 450" required>
                    </div>
                    <button type="submit" class="action-btn green-btn">Commit Expense Entry</button>
                </form>
                <div id="expenseFeedback" class="form-feedback"></div>
            </section>

            <!-- Form 3: Persistent Vehicle Profile Creator -->
            <section class="form-card">
                <h3>Register New Fleet Asset</h3>
                <form id="registerAssetForm">
                    <div class="form-group">
                        <label for="newVehicleId">Unique Asset ID</label>
                        <input type="text" id="newVehicleId" placeholder="e.g. TRK-2026-004" required
                            style="text-transform: uppercase;">
                    </div>
                    <div class="form-group">
                        <label for="newMakeModel">Manufacturer & Model</label>
                        <input type="text" id="newMakeModel" placeholder="e.g. Toyota Land Cruiser ZX" required>
                    </div>
                    <div class="form-group">
                        <label for="newEngineType">Engine Configuration</label>
                        <input type="text" id="newEngineType" placeholder="e.g. V35A-FTS 3.4L Twin-Turbo" required>
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                        <div class="form-group">
                            <label for="newCurrentOdometer">Odometer (km)</label>
                            <input type="number" id="newCurrentOdometer" min="0" placeholder="0" required>
                        </div>
                        <div class="form-group">
                            <label for="newLastServiceOdometer">Last Service (km)</label>
                            <input type="number" id="newLastServiceOdometer" min="0" placeholder="0" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="newAssetStatus">Deployment Status</label>
                        <select id="newAssetStatus" required>
                            <option value="Active">Active</option>
                            <option value="In Service">In Service</option>
                            <option value="In Transit">In Transit</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="newAssignedDriver">Assigned Operations Driver</label>
                        <input type="text" id="newAssignedDriver" placeholder="e.g. Francis Macheme" required>
                    </div>
                    <button type="submit" class="action-btn dynamic-blue-btn"
                        style="background-color: #007bff; color: white;">Commit New Asset Profile</button>
                </form>
                <div id="registerFeedback" class="form-feedback"></div>
            </section>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 FleetOps Logistics Management System v1.0</p>
    </footer>

    <script type="module" src="/js/dashboardHandler.mjs"></script>
</body>

</html>
